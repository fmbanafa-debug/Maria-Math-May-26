```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Math Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background: #f0f9ff; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); }
        .bubble { position: relative; background: white; border-radius: 1.5rem; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .bubble::before { content: ''; position: absolute; left: -8px; top: 20px; border-width: 8px 8px 8px 0; border-style: solid; border-color: transparent white transparent transparent; }
    </style>
</head>
<body class="p-4 min-h-screen flex items-center justify-center">
    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Sidebar -->
        <div class="space-y-4">
            <div class="glass p-6 rounded-3xl shadow-xl">
                <h1 class="text-xl font-bold text-blue-900 mb-4">Math Lessons</h1>
                <div class="flex flex-col gap-2" id="nav"></div>
            </div>
            <div class="glass p-4 rounded-3xl shadow-xl flex justify-center">
                <button id="mute-btn" onclick="toggleMute()" class="p-3 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 transition">
                    <span id="speaker-icon" class="text-xl">🔊</span>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="md:col-span-2 space-y-4">
            <div class="flex gap-4 items-start">
                <div class="w-14 h-14 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center text-2xl shadow-lg">👨‍🏫</div>
                <div id="teacher-bubble" class="bubble text-gray-800 flex-grow">
                    Hi! I'm your Imperial Math Tutor. Let's practice GCF, LCM, or Geometry! Click a lesson to start.
                </div>
            </div>

            <div id="display" class="glass p-8 rounded-[2rem] shadow-2xl min-h-[300px] flex flex-col justify-center text-center">
                <div id="inner-content">
                    <h2 class="text-3xl font-bold text-blue-800 mb-2">Welcome!</h2>
                    <p class="text-gray-600">Pick a topic on the left to begin our interactive session.</p>
                </div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="user-input" placeholder="Ask me a math question..." class="flex-grow p-4 rounded-2xl border-none shadow-lg focus:ring-2 focus:ring-blue-400 outline-none">
                <button onclick="handleAsk()" id="send-btn" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition">Ask</button>
            </div>
        </div>
    </div>

    <audio id="audio-player" class="hidden"></audio>

    <script>
        const topics = {
            'GCF': { t: "Greatest Common Factor", e: "The GCF is the largest number that divides evenly into two or more numbers. For example, the GCF of 8 and 12 is 4." },
            'LCM': { t: "Least Common Multiple", e: "The LCM is the smallest number that is a multiple of two or more numbers. The LCM of 3 and 4 is 12." },
            'Fractions': { t: "Simplest Form", e: "To simplify a fraction, divide the top and bottom by their GCF. $6/12$ becomes $1/2$!" },
            'Shapes': { t: "Quadrilaterals", e: "Quadrilaterals are 4-sided shapes. Rectangles have 4 right angles, and Trapezoids have only 1 pair of parallel sides." }
        };

        let isMuted = false;
        let isThinking = false;

        function init() {
            const nav = document.getElementById('nav');
            Object.keys(topics).forEach(k => {
                const b = document.createElement('button');
                b.className = "w-full text-left p-3 rounded-xl hover:bg-blue-50 text-blue-700 font-semibold transition";
                b.innerText = topics[k].t;
                b.onclick = () => showTopic(k);
                nav.appendChild(b);
            });
        }

        async function showTopic(k) {
            if (isThinking) return;
            const item = topics[k];
            document.getElementById('inner-content').innerHTML = `<h2 class="text-2xl font-bold text-blue-800 mb-2">${item.t}</h2><p class="text-lg">${item.e}</p>`;
            processResponse(item.e);
        }

        async function handleAsk() {
            const input = document.getElementById('user-input');
            const q = input.value.trim();
            if (!q || isThinking) return;

            input.value = '';
            setLoading(true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: q })
                });
                const data = await res.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm sorry, I couldn't process that.";
                processResponse(text);
            } catch (err) {
                processResponse("I'm having trouble connecting to my server. Check your Vercel settings!");
            } finally {
                setLoading(false);
            }
        }

        function processResponse(text) {
            document.getElementById('teacher-bubble').innerText = text;
            if (!isMuted) speak(text);
        }

        async function speak(text) {
            try {
                const res = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                const b64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (b64) playAudio(b64);
            } catch (e) { console.error("Audio error", e); }
        }

        function playAudio(b64) {
            const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
            const samples = new Int16Array(bytes.buffer);
            const wav = createWav(samples, 24000);
            const player = document.getElementById('audio-player');
            player.src = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
            player.play();
        }

        function createWav(samples, rate) {
            const buf = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buf);
            view.setUint32(0, 0x52494646, false); view.setUint32(4, 36 + samples.length * 2, true);
            view.setUint32(8, 0x57415645, false); view.setUint32(12, 0x666d7420, false);
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            view.setUint32(36, 0x64617461, false); view.setUint32(40, samples.length * 2, true);
            for (let i = 0; i < samples.length; i++) view.setInt16(44 + i * 2, samples[i], true);
            return buf;
        }

        function setLoading(l) {
            isThinking = l;
            document.getElementById('send-btn').innerText = l ? "..." : "Ask";
            document.getElementById('status-indicator').classList.toggle('opacity-50', l);
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('speaker-icon').innerText = isMuted ? "🔇" : "🔊";
            if (isMuted) document.getElementById('audio-player').pause();
        }

        init();
    </script>
</body>
</html>
